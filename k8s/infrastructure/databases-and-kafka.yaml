# 1. PostgreSQL - Issues DB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-issues
  namespace: jira-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-issues
  template:
    metadata:
      labels:
        app: postgres-issues
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "jira_user"
            - name: POSTGRES_PASSWORD
              value: "jira_password"
            - name: POSTGRES_DB
              value: "issues_db"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-issues
  namespace: jira-ai
spec:
  selector:
    app: postgres-issues
  ports:
    - port: 5432
      targetPort: 5432
---
