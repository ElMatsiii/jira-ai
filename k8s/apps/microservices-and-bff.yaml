# MS1: Issues Service (Go)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issues-service
  namespace: jira-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issues-service
  template:
    metadata:
      labels:
        app: issues-service
    spec:
      initContainers:
        # Waits for the topics created by the kafka-init-topics Job (k8s/infrastructure/kafka-topics-job.yaml).
        - name: wait-kafka-topics
          image: confluentinc/cp-kafka:7.5.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              for topic in issues.events analytics.query analytics.reply; do
                until kafka-topics --bootstrap-server kafka:9092 --describe --topic "$topic" >/dev/null 2>&1; do
                  echo "Esperando el topic $topic (Job kafka-init-topics)..."
                  sleep 5
                done
              done
      containers:
        - name: issues-service
          image: jira-issues-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "50051"
            - name: DATABASE_URL
              value: "postgres://jira_user:jira_password@postgres-issues:5432/issues_db?sslmode=disable"
            - name: DB_HOST
              value: "postgres-issues"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "jira_user"
            - name: DB_PASSWORD
              value: "jira_password"
            - name: DB_NAME
              value: "issues_db"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: issues-service
  namespace: jira-ai
spec:
  selector:
    app: issues-service
  ports:
    - port: 50051
      targetPort: 50051
---
