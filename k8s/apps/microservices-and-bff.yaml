---
# AI Layer: MCP Server (Node.js/TypeScript)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-agent
  namespace: jira-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-agent
  template:
    metadata:
      labels:
        app: mcp-agent
    spec:
      containers:
        - name: mcp-agent
          image: jira-mcp-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash-lite"
            # Below the BFF's 15 s timeout towards the agent; decompose-epic measured ~8.5 s.
            - name: GEMINI_TIMEOUT_MS
              value: "13000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jira-ai-secrets
                  key: GEMINI_API_KEY
                  optional: true
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-agent
  namespace: jira-ai
spec:
  selector:
    app: mcp-agent
  ports:
    - port: 3000
      targetPort: 3000
---
# BFF Layer: API Gateway (NestJS + GraphQL)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-gateway
  namespace: jira-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-gateway
  template:
    metadata:
      labels:
        app: bff-gateway
    spec:
      initContainers:
        # Waits for the topics created by the kafka-init-topics Job (k8s/infrastructure/kafka-topics-job.yaml).
        - name: wait-kafka-topics
          image: confluentinc/cp-kafka:7.5.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              for topic in issues.events analytics.query analytics.reply; do
                until kafka-topics --bootstrap-server kafka:9092 --describe --topic "$topic" >/dev/null 2>&1; do
                  echo "Esperando el topic $topic (Job kafka-init-topics)..."
                  sleep 5
                done
              done
      containers:
        - name: bff-gateway
          image: jira-bff-gateway:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4000"
            - name: ISSUES_GRPC_URL
              value: "issues-service:50051"
            - name: SPRINTS_GRPC_URL
              value: "sprints-service:50052"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: MCP_AGENT_URL
              value: "http://mcp-agent:3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jira-ai-secrets
                  key: JWT_SECRET
                  optional: true
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: bff-gateway
  namespace: jira-ai
spec:
  type: LoadBalancer
  selector:
    app: bff-gateway
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: jira-ai
  labels:
    app: web-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: jira-web-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: jira-ai
spec:
  type: LoadBalancer
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
