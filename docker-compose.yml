services:
  # Infrastructure: Zookeeper & Kafka Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: jira-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jira-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: jira-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - jira-network

  # Database 1: PostgreSQL for MS1 Issues & Projects
  postgres-issues:
    image: postgres:15-alpine
    container_name: jira-postgres-issues
    environment:
      POSTGRES_USER: jira_user
      POSTGRES_PASSWORD: jira_password
      POSTGRES_DB: issues_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pg_issues_data:/var/lib/postgresql/data
    networks:
      - jira-network

  # Database 2: PostgreSQL for MS2 Sprints & Planning
  postgres-sprints:
    image: postgres:15-alpine
    container_name: jira-postgres-sprints
    environment:
      POSTGRES_USER: jira_user
      POSTGRES_PASSWORD: jira_password
      POSTGRES_DB: sprints_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pg_sprints_data:/var/lib/postgresql/data
    networks:
      - jira-network

  # Database 3: MongoDB for MS3 Analytics & Metrics
  mongo-analytics:
    image: mongo:7.0
    container_name: jira-mongo-analytics
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_analytics_data:/data/db
    networks:
      - jira-network

  # MS1: Issues Service (Go)
  issues-service:
    build:
      context: .
      dockerfile: ./jira-issues-go/Dockerfile
    container_name: jira-issues-service
    depends_on:
      postgres-issues:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: "50051"
      DATABASE_URL: postgres://jira_user:jira_password@postgres-issues:5432/issues_db?sslmode=disable
      DB_HOST: postgres-issues
      DB_PORT: "5432"
      DB_USER: jira_user
      DB_PASSWORD: jira_password
      DB_NAME: issues_db
      KAFKA_BROKERS: kafka:9092
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - jira-network

  # MS2: Sprints Service (NestJS)
  sprints-service:
    build:
      context: .
      dockerfile: ./jira-sprints-nestjs/Dockerfile
    container_name: jira-sprints-service
    depends_on:
      postgres-sprints:
        condition: service_healthy
      issues-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: "50052"
      DB_HOST: postgres-sprints
      DB_PORT: "5432"
      DB_USER: jira_user
      DB_PASSWORD: jira_password
      DB_NAME: sprints_db
      MS1_GRPC_URL: issues-service:50051
      KAFKA_BROKERS: kafka:9092
    ports:
      - "50052:50052"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(50052,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - jira-network

  # MS3: Analytics Service (.NET 8)
  analytics-service:
    build:
      context: ./jira-analytics-dotnet
      dockerfile: Dockerfile
    container_name: jira-analytics-service
    depends_on:
      mongo-analytics:
        condition: service_healthy
      sprints-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo-analytics:27017
      MONGODB_DATABASE: analytics_db
      KAFKA_BROKERS: kafka:9092
      MS2_GRPC_URL: http://sprints-service:50052
    ports:
      - "8080:8080"
    networks:
      - jira-network

  # AI Layer: MCP Server (Node.js/TypeScript + Gemini 2.0 Flash)
  mcp-agent:
    build:
      context: ./jira-mcp-agent
      dockerfile: Dockerfile
    container_name: jira-mcp-agent
    environment:
      PORT: "3000"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "gemini-2.0-flash"
    ports:
      - "3000:3000"
    networks:
      - jira-network

  # BFF Layer: API Gateway (NestJS + GraphQL)
  bff-gateway:
    build:
      context: .
      dockerfile: ./jira-bff/Dockerfile
    container_name: jira-bff-gateway
    depends_on:
      postgres-issues:
        condition: service_healthy
      issues-service:
        condition: service_healthy
      sprints-service:
        condition: service_healthy
      analytics-service:
        condition: service_started
      mcp-agent:
        condition: service_healthy
    environment:
      PORT: "4000"
      ISSUES_GRPC_URL: issues-service:50051
      SPRINTS_GRPC_URL: sprints-service:50052
      KAFKA_BROKERS: kafka:9092
      MCP_AGENT_URL: http://mcp-agent:3000
      DATABASE_URL: postgresql://jira_user:jira_password@postgres-issues:5432/issues_db
      JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-before-deploy}"
    ports:
      - "4000:4000"
    networks:
      - jira-network

  # Frontend Web: React 18 + Vite / Nginx
  web-frontend:
    build:
      context: ./jira-web
      dockerfile: Dockerfile
    container_name: jira-web-frontend
    depends_on:
      - bff-gateway
    ports:
      - "5173:80"
      - "80:80"
    networks:
      - jira-network

volumes:
  pg_issues_data:
  pg_sprints_data:
  mongo_analytics_data:

networks:
  jira-network:
    driver: bridge
